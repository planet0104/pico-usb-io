[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
io-proto = { path = "../protocol" }
pio = "0.3"
serialport = "4"
thiserror = "2"

[[bin]]
name = "blink"
path = "src/main.rs"

[[bin]]
name = "record"
path = "src/record.rs"

[[bin]]
name = "ws2812"
path = "src/ws2812.rs"

[[bin]]
name = "servo"
path = "src/servo.rs"

[[bin]]
name = "ir"
path = "src/ir.rs"

[[bin]]
name = "battery"
path = "src/battery.rs"

[[bin]]
name = "touch"
path = "src/touch.rs"

[[bin]]
name = "oled"
path = "src/oled.rs"
