[package]
name = "host"
version = "0.1.0"
edition = "2021"

[dependencies]
io-proto = { path = "../protocol" }
lz4_flex = "0.14"
pio = "0.3"
serialport = { version = "4", default-features = false }
thiserror = "2"

# 只给 examples/camera.rs（电脑摄像头预览测速）用，不影响依赖 host 库的程序
[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }

[[bin]]
name = "blink"
path = "src/main.rs"

[[bin]]
name = "record"
path = "src/record.rs"

[[bin]]
name = "ws2812"
path = "src/ws2812.rs"

[[bin]]
name = "servo"
path = "src/servo.rs"

[[bin]]
name = "ir"
path = "src/ir.rs"

[[bin]]
name = "battery"
path = "src/battery.rs"

[[bin]]
name = "touch"
path = "src/touch.rs"

[[bin]]
name = "oled"
path = "src/oled.rs"

[[bin]]
name = "stepper"
path = "src/stepper.rs"

[[bin]]
name = "st7789"
path = "src/st7789.rs"

[[bin]]
name = "gps"
path = "src/gps.rs"
